<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="card">

    <h2>🔑 Forgot Password</h2>

    <p>Enter your registered email.</p>

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required>

        <button type="submit">
            Send OTP
        </button>

    </form>

    <a href="/login">
        ⬅ Back to Login
    </a>

</div>

</body>

</html>
