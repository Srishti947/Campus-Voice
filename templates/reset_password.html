<!DOCTYPE html>
<html>

<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="card">

    <h2>🔐 Reset Password</h2>

    <form method="POST">

        <input
            type="text"
            name="otp"
            placeholder="Enter OTP"
            required>

        <input
            type="password"
            name="password"
            placeholder="Enter New Password"
            required>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <a href="/login">
        ⬅ Back to Login
    </a>

</div>

</body>

</html>
